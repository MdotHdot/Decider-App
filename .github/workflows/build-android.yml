# Build a debug APK on GitHub (recommended on Mac — no local Linux/Docker needed).
# Trigger: Actions → "Build Android APK" → Run workflow
# Download the APK from the run's Artifacts.

name: Build Android APK

on:
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer (stable PyPI stack)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Pin a stable stack: p4a master + Python 3.11 (not develop/3.14)
          python -m pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      - name: Cache Buildozer / SDK
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-stable-${{ runner.os }}-${{ hashFiles('buildozer.spec', '.github/workflows/build-android.yml') }}

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: movie-decider-apk
          path: bin/*.apk
          if-no-files-found: error
